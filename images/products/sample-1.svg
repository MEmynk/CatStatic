  <text x="600" y="490" font-family="Arial, sans-serif" font-size="24" fill="#8b93a1" text-anchor="middle" letter-spacing="8">Sample Image</text>
  <text x="600" y="800" font-family="Arial, sans-serif" font-size="18" fill="#5c626e" text-anchor="middle" letter-spacing="6">PATHAN STEEL</text>
