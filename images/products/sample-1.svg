<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#2a2d34"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6d33"/>
      <stop offset="50%" stop-color="#e8c98a"/>
      <stop offset="100%" stop-color="#c9a45c"/>
    </linearGradient>
    <pattern id="p1" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-opacity="0.025" stroke-width="2"/>
